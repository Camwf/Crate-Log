<script>
  try{
    const t = localStorage.getItem('crate-log-theme');
    const wantsLight = t === 'light' || (t !== 'dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    if(wantsLight) document.documentElement.classList.add('light-mode');
  }catch(e){}
</script>
